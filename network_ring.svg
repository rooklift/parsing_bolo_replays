<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="100%" role="img"><title>Ring network</title><desc>Five Bolo client tanks arranged in a circle with no server. Each tank passes updates one way around the ring to its neighbour, so no single machine holds the whole game.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="340" height="300" rx="6" fill="#f7f6f2"/><path d="M191.0 60.3 A95.0 95.0 0 0 1 239.3 95.4" fill="none" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-end="url(#a)"/><path d="M252.3 135.4 A95.0 95.0 0 0 1 233.9 192.1" fill="none" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-end="url(#a)"/><path d="M199.8 216.9 A95.0 95.0 0 0 1 140.2 216.9" fill="none" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-end="url(#a)"/><path d="M106.1 192.1 A95.0 95.0 0 0 1 87.7 135.4" fill="none" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-end="url(#a)"/><path d="M100.7 95.4 A95.0 95.0 0 0 1 149.0 60.3" fill="none" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-end="url(#a)"/><circle cx="170.0" cy="45.0" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="170.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 1</text><circle cx="260.4" cy="110.6" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="260.4" y="110.6" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 2</text><circle cx="225.8" cy="216.9" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="225.8" y="216.9" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 3</text><circle cx="114.2" cy="216.9" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="114.2" y="216.9" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 4</text><circle cx="79.6" cy="110.6" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="79.6" y="110.6" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 5</text><text x="170" y="140" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#52514e">no server</text><text x="170" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#52514e">ring: each tank only hears from the one before it</text></svg>