<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="100%" role="img"><title>Hub and spoke network</title><desc>A server in the centre with five client tanks around it. Every client exchanges updates only with the server, which holds the authoritative game state.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="340" height="300" rx="6" fill="#f7f6f2"/><line x1="170.0" y1="110.0" x2="170.0" y2="70.0" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-start="url(#a)" marker-end="url(#a)"/><line x1="198.5" y1="130.7" x2="236.6" y2="118.4" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-start="url(#a)" marker-end="url(#a)"/><line x1="187.6" y1="164.3" x2="211.1" y2="196.6" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-start="url(#a)" marker-end="url(#a)"/><line x1="152.4" y1="164.3" x2="128.9" y2="196.6" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-start="url(#a)" marker-end="url(#a)"/><line x1="141.5" y1="130.7" x2="103.4" y2="118.4" stroke="#5f5e5a" stroke-width="1.5" opacity="0.7" marker-start="url(#a)" marker-end="url(#a)"/><circle cx="170.0" cy="45.0" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="170.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 1</text><circle cx="260.4" cy="110.6" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="260.4" y="110.6" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 2</text><circle cx="225.8" cy="216.9" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="225.8" y="216.9" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 3</text><circle cx="114.2" cy="216.9" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="114.2" y="216.9" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 4</text><circle cx="79.6" cy="110.6" r="22" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/><text x="79.6" y="110.6" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">tank 5</text><circle cx="170.0" cy="140.0" r="28" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/><text x="170.0" y="140.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="500" fill="#0b0b0b">server</text><text x="170" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12" fill="#52514e">hub and spoke: the server sees everything</text></svg>